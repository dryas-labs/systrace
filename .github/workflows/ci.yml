name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: product (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source and run unit tests
        run: npm run check
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build configured OpenSysML engine
        run: node scripts/build-engine.mjs
      - name: Test native engine and MCP tools
        run: npm run test:engine
      - name: Package VSIX
        run: npm run package:vsix
      - name: Test packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host -- --vsix
      - name: Test packaged extension on Windows
        if: runner.os == 'Windows'
        run: npm run test:host -- --vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v7.0.2
        with:
          name: systrace-vsix-${{ matrix.os }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14
